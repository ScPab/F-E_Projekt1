# Conda/Mamba-Environment für den Mediator-Service.
# Enthält die wissenschaftlichen Kernpakete (anndata, scanpy) für das
# Zielformat der Datenintegration sowie das Web-Framework für den Service.
#
# Aufbau lokal:   mamba env create -f environment.yml
# Aktualisieren:  mamba env update -f environment.yml --prune
name: databridge-mediator
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - fastapi
  - uvicorn
  - pydantic
  - python-dotenv
  - requests
  - anndata
  - scanpy
  # Semantische Schicht: GDC-JSON -> RDF/OWL (app/semantic/mapping.py), siehe
  # wissensnetz/Mapping-Konzept_GDC-zu-RDF-OWL.
  - rdflib
  - pip
  - pip:
      # Lokales Wrapper-Package (Mediator-Wrapper-Muster, siehe /wrappers).
      # Absoluter Pfad: pip löst relative editable-Pfade relativ zum
      # Verzeichnis auf, in dem `mamba env create` läuft (WORKDIR /app,
      # siehe Dockerfile), NICHT relativ zum Docker-Build-Context. Das
      # Wrapper-Package liegt im Container unter /wrappers (siehe COPY im
      # Dockerfile) — ein relativer Pfad "./wrappers" würde also
      # fälschlich /app/wrappers suchen und fehlschlagen.
      - -e /wrappers
      # Wissensnetz-Package (Graphstore-Client für graph-db), siehe
      # wissensnetz/pyproject.toml: "Der Mediator kann es später optional
      # per pip install -e ./wissensnetz nutzen". Ermöglicht POST /transform
      # mit load=true (direkter Fuseki-Import statt nur Turtle-Text-Rückgabe).
      - -e /wissensnetz
